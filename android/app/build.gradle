plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'org.dpay.ffitest'
    compileSdk 35
    ndkVersion '27.3.13750724'

    defaultConfig {
        applicationId 'org.dpay.ffitest'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        // Emulator here is x86_64; a real phone is arm64-v8a. Ship both.
        ndk { abiFilters 'x86_64', 'arm64-v8a' }
    }

    // Single source of truth: consume the UniFFI Kotlin binding straight from the ffi crate,
    // and the NDK-built .so from its jniLibs tree — no copies to drift.
    sourceSets {
        main.java.srcDirs += '../../crates/dpay-ffi/bindings/kotlin'
    }

    buildFeatures {
        buildConfig false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    // UniFFI's Kotlin runtime is JNA; the @aar variant bundles libjnidispatch.so per ABI.
    implementation 'net.java.dev.jna:jna:5.14.0@aar'

    // SAME barcode deps react-native-vision-camera ships the real app
    // (app/node_modules/react-native-vision-camera/android/build.gradle:204+208), pinned to the
    // identical versions. `implementation` merges MlKitInitProvider + the bundled libbarhopper_v3.so
    // into the target APK so instrumented tests can decode offline; `androidTestImplementation`
    // restores compile visibility for the test sourceset. The play-services artifact carries the
    // public API classes (BarcodeScanning/BarcodeScannerOptions) — excluding it breaks compile.
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'com.google.android.gms:play-services-mlkit-barcode-scanning:18.3.1'
    androidTestImplementation 'com.google.mlkit:barcode-scanning:17.3.0'
    androidTestImplementation 'com.google.android.gms:play-services-mlkit-barcode-scanning:18.3.1'

    // CameraX pinned to the SAME version react-native-vision-camera uses
    // (app/node_modules/react-native-vision-camera/android/build.gradle:188) — the frame-flow
    // device gate must exercise the exact ImageAnalysis stack the app ships. camera-camera2 must
    // ALSO be a main `implementation` dep: CameraX resolves its default implementation in the
    // TARGET process at runtime ("CameraX is not configured properly" if only in the test APK).
    def camerax_version = '1.5.0-alpha03'
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    androidTestImplementation "androidx.camera:camera-core:${camerax_version}"
    androidTestImplementation "androidx.camera:camera-camera2:${camerax_version}"
    androidTestImplementation "androidx.camera:camera-lifecycle:${camerax_version}"

    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
}
