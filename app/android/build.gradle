buildscript {
    ext {
        // Phase B (issue #11): API 36 + build-tools 36.1.0 before the 2026-08-31 Play deadline.
        // AGP 8.12 (which supports API 36) is brought in by the RN 0.86 bundled gradle-plugin
        // catalog; the versionless classpath below resolves through that included build.
        buildToolsVersion = "36.1.0"
        minSdkVersion = 24                    // matches the API level the NDK .so is built against
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.3.13750724"          // the NDK actually installed in this environment
        kotlinVersion = "2.1.20"               // matches the Kotlin pinned by RN 0.86's gradle-plugin
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // Keep the offline dev loop independent of publishing-only dependencies.
        if (System.getenv("DPAY_PLAY_PUBLISH") == "1") {
            classpath("com.github.triplet.gradle:play-publisher:3.13.0")
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
