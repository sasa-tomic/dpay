# Cloudflare Tunnel ingress for the dpay relay — committed & versioned (this is the reproducible part).
#
# Named (config-file) tunnel, not the dashboard/token variant: the routing rules live here in git;
# only the per-deployment secret (credentials.json) stays out. Two values are per-deployment and must
# be filled in before `docker compose up` (neither is a secret):
#
#   1. tunnel     — the UUID printed by `cloudflared tunnel create dpay-relay` (also the credentials
#                   filename). A name works too, but the UUID needs no account cert at runtime.
#   2. hostname   — the public hostname you route to this tunnel with
#                   `cloudflared tunnel route dns dpay-relay <hostname>`.
#
# See deploy/README.md for the full one-time setup. `cloudflared tunnel ingress validate config.yml`
# checks this file.

tunnel: <TUNNEL_UUID>
credentials-file: /etc/cloudflared/credentials.json

ingress:
  # Public hostname → the relay, reached by service name over the compose network (plain HTTP; TLS is
  # terminated at the Cloudflare edge).
  - hostname: relay.dpay.example
    service: http://relay:8787
  # Everything else 404s (required catch-all rule).
  - service: http_status:404
