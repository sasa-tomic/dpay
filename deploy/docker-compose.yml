# dpay relay stack: the relay (dpay's only online piece) behind a Cloudflare Tunnel.
#
#   just image                # build the image (host-built binary → slim runtime)
#   cp .env.example .env      # set DPAY_CANISTER_ID and CF_TUNNEL_TOKEN
#   # one-time: create the tunnel and public hostname in Cloudflare Zero Trust (see README.md)
#   docker compose up -d      # relay + cloudflared  (see README.md)
#
# cloudflared dials OUT to Cloudflare's edge, so nothing here publishes a host port: TLS terminates at
# the edge and the tunnel reaches the relay by service name over the compose network. The public
# hostname and ingress live in Cloudflare Zero Trust, not here.
#
# The image is configuration-free; *this file* decides which ledger the relay settles on. Nothing
# below is environment-specific — the same compose file runs against a local dfx replica, a testnet,
# or mainnet. Only .env (and the tunnel's ingress) changes.
name: dpay

services:
  relay:
    build:
      context: .                  # just the binary in ./dist — see Dockerfile
      dockerfile: Dockerfile
      args:
        # Direct `docker compose up --build` copies a host-built binary. Ubuntu 24.04 supplies
        # glibc 2.39, including the GLIBC_2.38 symbols absent from Debian 12/bookworm.
        RUNTIME_BASE: ${DPAY_RUNTIME_BASE:-ubuntu:24.04}
    image: ${DPAY_IMAGE:-dpay-relay:latest}
    restart: unless-stopped
    environment:
      DPAY_RELAY_ADDR: 0.0.0.0:8787

      # --- which ledger, on which network ---------------------------------------------------
      # `ic` = a real canister via ic-agent. `memory` = the in-memory demo ledger (no canister).
      DPAY_LEDGER: ${DPAY_LEDGER:-ic}
      # The canister the relay settles on. Required when DPAY_LEDGER=ic — the relay exits if unset
      # rather than fall back to a pretend ledger.
      DPAY_CANISTER_ID: ${DPAY_CANISTER_ID:-}
      # Mainnet: https://icp-api.io  ·  local dfx replica on the host: http://host.docker.internal:4943
      DPAY_IC_URL: ${DPAY_IC_URL:-https://icp-api.io}
      # Root key: MUST be true for a local replica (it has its own), MUST be false on mainnet (where
      # fetching it means trusting whatever key the endpoint returns). The relay refuses the unsafe
      # combination at startup. Unset → true only for a loopback URL.
      DPAY_IC_FETCH_ROOT_KEY: ${DPAY_IC_FETCH_ROOT_KEY:-}

      # POST /faucet mints demo funds. This switch gates the OFFLINE FIXTURE faucet (the
      # test-helpers build, which credits an in-process fake gateway) — off by default, and only
      # ever worth turning on against a throwaway replica. It does NOT gate the faucet this
      # production image compiles: that one mints through the facade canister and is gated by
      # DPAY_CONTROLLER_SEED below.
      DPAY_ENABLE_FAUCET: ${DPAY_ENABLE_FAUCET:-false}

      # The OpenCryptoPay till (POST /api/v1/till + /api/v1/till/void + /v1/lnurlp/*). Served BY
      # DEFAULT (founder decision 2026-09-10) — set DPAY_ENABLE_TILL=false to un-register all
      # eight routes. The merchant routes carry their own signed authorisation rather than a
      # deploy-time secret: crates/dpay-relay/src/app.rs.
      DPAY_ENABLE_TILL: ${DPAY_ENABLE_TILL:-true}

      # The faucet (agent build): hex Ed25519 seed of the canister CONTROLLER key (the same key
      # material as DPAY_DFX_IDENTITY's identity.pem). Set → the relay signs its faucet `mint`
      # calls and POST /api/v1/faucet works (relay-side cooldown + authenticated mint, crediting
      # the user principal), and GET /api/v1/capabilities reports `demo_faucet:true`. Unset → the
      # agent is anonymous, the faucet is unavailable (503 naming this variable), and the wallet
      # shows no top-up action. THIS is the production faucet's gate — not DPAY_ENABLE_FAUCET
      # above. SECRET: treat like the PEM itself.
      DPAY_CONTROLLER_SEED: ${DPAY_CONTROLLER_SEED:-}

      # The Solana JSON-RPC proxy (POST /api/v1/solana/rpc): the FULL provider endpoint INCLUDING
      # its api key (e.g. https://mainnet.helius-rpc.com/?api-key=…). SECRET — never logged by
      # the relay, never echoed in a response, never committed. Unset → the route answers 503
      # naming this variable (registered on every build, so it never 404s). The proxy is a pure
      # pipe for sendTransaction and shares allowlisted reads over a short TTL cache
      # (crates/dpay-relay/src/solana.rs).
      DPAY_SOLANA_RPC_URL: ${DPAY_SOLANA_RPC_URL:-}
      # Per-call upstream timeout for the proxy, ms (default 10000; 0 refused at startup).
      DPAY_SOLANA_TIMEOUT_MS: ${DPAY_SOLANA_TIMEOUT_MS:-}

    # Lets DPAY_IC_URL point at a dfx replica running on the host (http://host.docker.internal:4943)
    # — the pre-mainnet rehearsal: the real container, the real agent path, a replica you own.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    expose:
      - "8787"                    # reachable to cloudflared on the compose network, not published to host
    # Uncomment to hit the relay directly (bypassing the tunnel), bound to loopback only — e.g. the
    # local-replica rehearsal in README.md, or a relay-only bring-up (`docker compose up -d relay`):
    # ports:
    #   - "127.0.0.1:8787:8787"

    # The relay holds no secrets and writes nothing to disk: its only state is an idempotency cache
    # in memory (see README). So it can run with a read-only root fs and no capabilities at all.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    healthcheck:
      # /health consults the ledger (agent status), so this is red when the canister is unreachable,
      # not merely when the socket is closed.
      test: ["CMD", "curl", "-fsS", "http://localhost:8787/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # The tunnel. cloudflared dials out to Cloudflare's edge and forwards the public hostname to the
  # relay over the compose network — no inbound host ports, TLS terminates at the edge. The named
  # tunnel's ingress is configured in Cloudflare Zero Trust. The token is supplied through .env.
  cloudflared:
    image: ${DPAY_CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.7.1}
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN:?set CF_TUNNEL_TOKEN in deploy/.env}
    depends_on:
      relay:
        condition: service_healthy   # tunnel comes up only once the relay can settle (see /health)
    security_opt:
      - no-new-privileges:true
