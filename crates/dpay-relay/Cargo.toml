[package]
name = "dpay-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "dpay relay: the read-and-host surface around the dpay IC rails — currency catalog, balances/history at the user's principal, onramp metadata, the web wallet, and APK hosting. Value never moves through it (the app signs /api/v2 envelopes itself)."

[lib]
path = "src/lib.rs"

[[bin]]
name = "dpay-relay"
path = "src/main.rs"

[features]
# The real ic-agent settlement path (talks to a live local IC replica). OFF by default so the
# fast in-memory inner loop (`cargo nextest run -p dpay-relay`) stays offline and quick — and
# never even compiles the heavy ic-agent / pocket-ic trees. The justfile's `test-live` recipe
# enables it: `cargo nextest run -p dpay-relay --features agent`.
#
# `pocket-ic` (test infra) and `candid` are optional *regular* deps rather than dev-deps on
# purpose: dev-deps compile unconditionally, which would tax the no-feature inner loop; gating
# them behind `agent` keeps that loop lean while still making them available to the feature-gated
# `tests/live.rs` integration test.
agent = ["dep:ic-agent", "dep:candid", "dep:pocket-ic", "dep:icrc-ledger-types", "dep:num-traits", "dpay-core/rng"]

# Test-only HTTP surface for the e2e harness: the fake-IC `/api/v2` gateway (the offline
# stand-in for icp-api.io — the app signs envelopes and POSTs them HERE), plus the `POST /api/v1/faucet`
# fixture route the suite rides. OFF by default and
# **MUST NOT** be enabled in the prod image (`just image` never passes it): everything it gates is
# `#[cfg(feature = "test-helpers")]`, so it does not compile into the prod binary. The local e2e
# harness and the relay test suite build with `--features test-helpers`.
test-helpers = []

[dependencies]
dpay-core = { path = "../dpay-core" }
dpay-icp = { path = "../dpay-icp" }
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tower = "0.5.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
async-trait = "0.1.91"
thiserror = "2.0.19"
hex = "0.4.3"
base64 = "0.22.1"
# `join_all` for the batch balances endpoint — fans out the per-currency balance queries CONCURRENTLY
# (one relay→ledger round trip per currency, polled together) so a 6-currency batch returns in ~the
# slowest single query, not 6× sequentially. Already compiled transitively (tokio/async-trait pull
# futures-core/-task/-util), so this adds no new build weight. Default features (std/async-await/alloc)
# are exactly what `join_all` needs.
futures-util = "0.3"
# sha256 of the served APK — the strong ETag on /download/dpay.apk + the `?v=` cache-buster
# (computed once in `AppState::with_apk`). Already in the dep tree (transitively locked at 0.10.9).
sha2 = "0.10"
# The OS CSPRNG behind the till's charge/quote ids (`till::fresh_id`) — a bearer read-token needs
# real randomness, not a hash of a clock. Already in the tree at 0.2.17 (rand_core pulls it for
# ed25519-dalek's key generation), so this names an existing edge rather than adding a crate.
getrandom = "0.2"
# The partner-agreement's POSTGRES store (2026-09-22, founder directive: "postgres is being
# backed up, flat files are not"). When DPAY_TROCADOR_PG_DSN is set the Trocador compliance
# access log + order store persist to PG instead of the JSONL files; unset keeps the JSONL
# behavior byte-identical (the offline default). ONE dedicated writer connection, owned by the
# store's persist thread, serializes every INSERT in arrival order (the append-only ordering
# guarantee the JSONL files get from write-under-lock). DELIBERATELY NO deadpool pool: the
# single serialized writer makes checkout fan-out dead weight, and no pool is what keeps the
# agreement's sync order-store methods (open_order/apply_webhook — pinned by the offline test
# suite) able to block on a durable-write ack without borrowing a runtime.
tokio-postgres = "0.7"
# The Solana RPC proxy's one-hop upstream client (`src/solana.rs`). Pinned to the 0.12 line that
# ic-agent already locks into the tree (0.12.28, in the offline registry cache) so this adds NO
# new crates. rustls-tls, NOT default-tls (native-tls → system OpenSSL): the deploy image
# deliberately has no system OpenSSL — see the ic-agent note below, same choice. The proxy sets
# `redirect(Policy::none())`: a pure pipe forwards exactly one hop and never chases redirects.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# --- `agent` feature only ---
# ic-agent 0.48.1 is the current crates.io release (2026-07-07); it depends on candid ^0.10.10,
# compatible with the workspace pin (=0.10.22). reqwest (rustls by default — no system OpenSSL) is
# a mandatory dep of ic-agent, so default features suffice for talking to a local replica.
# pocket-ic drives the live local IC (HTTP gateway) in tests/live.rs.
ic-agent = { version = "=0.48.1", optional = true }
candid = { workspace = true, optional = true }
pocket-ic = { workspace = true, optional = true }
# icrc-ledger-types (ICRC-1/3 account + transaction types) is used by `AgentLedger` itself —
# the icrc3 history walk — and by the `agent`-feature live test; num-traits converts candid Nat
# amounts to u64 on the same path.
icrc-ledger-types = { workspace = true, optional = true }
num-traits = { version = "0.2", optional = true }

[dev-dependencies]
dpay-core = { path = "../dpay-core", features = ["rng"] }
dpay-relay = { path = ".", features = ["test-helpers"] }
ed25519-dalek = { workspace = true }
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.4"
# Live tests derive the controller's self-authenticating principal from a known Ed25519 seed
# (the same computation the canister's `user_account_of` and the app's icpSelfPrincipal do).
dpay-icp = { path = "../dpay-icp" }
# The gated PG tests (DPAY_TEST_PG_DSN) read rows back through their OWN connection — the
# store's writer thread stays the write path under test. Same crate as the regular dep above
# (zero extra build weight).
tokio-postgres = "0.7"
