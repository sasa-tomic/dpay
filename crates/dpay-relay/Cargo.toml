[package]
name = "dpay-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "dpay relay: submits the payer's offline-signed authorization to the ledger; idempotent, retrying, health-checked. The only online dependency in the PoC."

[lib]
path = "src/lib.rs"

[[bin]]
name = "dpay-relay"
path = "src/main.rs"

[features]
# The real ic-agent settlement path (talks to a live local IC replica). OFF by default so the
# fast in-memory inner loop (`cargo nextest run -p dpay-relay`) stays offline and quick — and
# never even compiles the heavy ic-agent / pocket-ic trees. The justfile's `test-live` recipe
# enables it: `cargo nextest run -p dpay-relay --features agent`.
#
# `pocket-ic` (test infra) and `candid` are optional *regular* deps rather than dev-deps on
# purpose: dev-deps compile unconditionally, which would tax the no-feature inner loop; gating
# them behind `agent` keeps that loop lean while still making them available to the feature-gated
# `tests/live.rs` integration test.
agent = ["dep:ic-agent", "dep:candid", "dep:pocket-ic", "dep:icrc-ledger-types", "dep:num-traits", "dpay-core/rng"]

# Test-only HTTP surface for the e2e harness: adds `POST /api/v1/test/deposit/seed` so a browser
# harness can simulate a confirmed ckBTC deposit landing on the FakeLedger (mirrors
# `FakeLedger::register_deposit` — drain-on-next-refresh). OFF by default and **MUST NOT** be
# enabled in the prod image (`just image` never passes it): the route + the trait method it calls
# are both `#[cfg(feature = "test-helpers")]`, so they do not compile into the prod binary. The
# local e2e harness builds the relay with `--features test-helpers`.
test-helpers = []

[dependencies]
dpay-core = { path = "../dpay-core" }
# Ed25519 for FakeLedger's receipt signing (the offline demo ledger signs the outcome receipt with a
# stable test key — the real canister's equivalent comes from raw_rand). Already in the dep tree via
# dpay-core; declared directly so the relay can `use ed25519_dalek::SigningKey`.
ed25519-dalek = { workspace = true }
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tower = "0.5.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
async-trait = "0.1.91"
thiserror = "2.0.19"
hex = "0.4.3"
base64 = "0.22.1"
# `join_all` for the batch balances endpoint — fans out the per-currency balance queries CONCURRENTLY
# (one relay→ledger round trip per currency, polled together) so a 6-currency batch returns in ~the
# slowest single query, not 6× sequentially. Already compiled transitively (tokio/async-trait pull
# futures-core/-task/-util), so this adds no new build weight. Default features (std/async-await/alloc)
# are exactly what `join_all` needs.
futures-util = "0.3"

# --- `agent` feature only ---
# ic-agent 0.48.1 is the current crates.io release (2026-07-07); it depends on candid ^0.10.10,
# compatible with the workspace pin (=0.10.22). reqwest (rustls by default — no system OpenSSL) is
# a mandatory dep of ic-agent, so default features suffice for talking to a local replica.
# pocket-ic drives the live local IC (HTTP gateway) in tests/live.rs.
ic-agent = { version = "=0.48.1", optional = true }
candid = { workspace = true, optional = true }
pocket-ic = { workspace = true, optional = true }
# icrc-ledger-types + num-traits: only needed by the `agent`-feature live test, which installs a real
# ICRC ledger + the facade canister end-to-end (mirrors dpay-canister-tests).
icrc-ledger-types = { workspace = true, optional = true }
num-traits = { version = "0.2", optional = true }

[dev-dependencies]
dpay-core = { path = "../dpay-core", features = ["rng"] }
ed25519-dalek = { workspace = true }
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.4"
