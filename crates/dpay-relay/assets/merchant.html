<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>dpay · Merchant terminal</title>
<style>
  :root { --brand:#4f46e5; --ink:#0b0b0f; --sub:#6b7280; --ok:#16a34a; --bad:#dc2626; --warn:#b45309; --line:#e5e7eb; --field:#f3f4f6; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:#fafafa; }
  header { padding:16px 28px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; }
  .brand { font-size:22px; font-weight:800; color:var(--brand); }
  .who { display:flex; flex-direction:column; }
  .who .name { font-weight:700; font-size:15px; }
  .who .id { font-family:ui-monospace,monospace; font-size:11px; color:var(--sub); }
  .dot { margin-left:auto; font-size:13px; color:var(--sub); }
  .dot b { display:inline-block; width:9px; height:9px; border-radius:50%; background:#9ca3af; vertical-align:middle; margin-right:6px; }
  .dot.ok b { background:var(--ok); } .dot.down b { background:var(--bad); }
  main { max-width:1040px; margin:0 auto; padding:22px; display:grid; grid-template-columns:1fr 1fr 300px; gap:18px; align-items:start; }
  @media (max-width:900px){ main { grid-template-columns:1fr; } }
  .card { background:#fff; border:1px solid var(--line); border-radius:18px; padding:22px; }
  .card h2 { margin:0 0 4px; font-size:14px; color:var(--sub); font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
  .step { color:var(--sub); font-size:13px; margin-bottom:14px; }
  .amountRow { display:flex; align-items:center; background:var(--field); border-radius:14px; padding:0 16px; height:66px; }
  .amountRow span { font-size:30px; font-weight:800; }
  .amountRow input { border:0; background:transparent; font-size:30px; font-weight:800; width:100%; margin-left:6px; outline:none; color:var(--ink); }
  button { font:inherit; font-weight:600; border:0; border-radius:12px; padding:13px 20px; cursor:pointer; }
  .primary { background:var(--brand); color:#fff; font-size:16px; width:100%; margin-top:12px; }
  .ghost { background:var(--field); color:var(--ink); }
  .row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:12px; }
  .reqLabel { text-align:center; color:var(--sub); font-size:13px; margin:16px 0 8px; }
  .qrbox { display:flex; justify-content:center; }
  .qrbox svg { width:230px; height:230px; }
  .big { text-align:center; font-size:28px; font-weight:800; margin-top:8px; }
  .pid { text-align:center; font-family:ui-monospace,monospace; font-size:11px; color:var(--sub); margin-top:4px; }
  .camLabel { color:var(--sub); font-size:13px; margin-bottom:8px; text-align:center; }
  video { width:100%; max-width:320px; border-radius:14px; background:#111827; aspect-ratio:1/1; object-fit:cover; display:block; margin:0 auto; }
  canvas { display:none; }
  textarea { width:100%; height:56px; border:1px solid var(--line); border-radius:12px; padding:9px; font-family:ui-monospace,monospace; font-size:11px; margin-top:10px; }
  .result { margin-top:16px; text-align:center; min-height:24px; }
  .paid { color:var(--ok); font-size:30px; font-weight:800; }
  .sub  { color:var(--sub); font-size:14px; margin-top:6px; }
  .refused { color:var(--bad); font-size:22px; font-weight:800; }
  .warnmsg { color:var(--warn); font-size:16px; font-weight:700; }
  .mono { font-family:ui-monospace,monospace; font-size:11px; color:var(--sub); margin-top:6px; word-break:break-all; }
  .muted { opacity:.45; pointer-events:none; }
  /* recent list */
  .txns { list-style:none; margin:8px 0 0; padding:0; }
  .txns li { display:flex; justify-content:space-between; align-items:baseline; padding:9px 0; border-bottom:1px solid var(--line); }
  .txns .amt { font-weight:700; color:var(--ok); }
  .txns .meta { font-size:11px; color:var(--sub); font-family:ui-monospace,monospace; }
  .empty { color:var(--sub); font-size:13px; padding:8px 0; }
  footer { max-width:1040px; margin:0 auto; padding:0 22px 28px; color:var(--sub); font-size:13px; }
  footer a { color:var(--brand); }
</style>
</head>
<body>
<header>
  <span class="brand">dpay</span>
  <span class="who"><span class="name">Café Demo</span><span class="id" id="merchId"></span></span>
  <span class="dot" id="dot"><b></b><span id="dotText">checking…</span></span>
</header>
<main>
  <!-- STEP 1: set the amount, show a request QR -->
  <div class="card" id="chargeCard">
    <h2>1 · Charge</h2>
    <div class="step">Enter what the customer owes, then show them the QR.</div>
    <div class="amountRow"><span>∂</span><input id="amt" value="25.00" inputmode="decimal" /></div>
    <button class="primary" id="createBtn">Create request</button>
    <div id="reqArea" style="display:none">
      <div class="reqLabel">Show this to the payer’s phone</div>
      <div class="qrbox" id="reqQr"></div>
      <div class="big" id="reqAmt"></div>
      <div class="pid" id="reqPid"></div>
      <div class="row"><button class="ghost" id="newBtn">New charge</button></div>
    </div>
  </div>

  <!-- STEP 2: scan the payer's signed QR and settle -->
  <div class="card muted" id="collectCard">
    <h2>2 · Collect</h2>
    <div class="step">After the payer approves, scan the QR their phone shows.</div>
    <div class="camLabel">📷 Scan the payer’s signed QR</div>
    <video id="video" playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div class="row">
      <button class="primary" id="startBtn">Enable camera</button>
      <button class="ghost" id="stopBtn" style="display:none">Stop</button>
    </div>
    <textarea id="pasteBox" placeholder="…or paste the payer’s auth code"></textarea>
    <div class="row"><button class="ghost" id="pasteBtn">Submit pasted code</button></div>
    <div class="result" id="result"></div>
  </div>

  <!-- Recent payments -->
  <div class="card">
    <h2>Recent</h2>
    <ul class="txns" id="txns"><li class="empty">No payments yet.</li></ul>
  </div>
</main>
<footer><a href="/">dpay home</a> · <a href="/privacy">Privacy policy</a></footer>

<script src="/jsqr.js"></script>
<script src="/qrcode.js"></script>
<script>
const $ = id => document.getElementById(id);
const demoAmt = c => '∂' + Math.floor(c/100) + '.' + String(c%100).padStart(2,'0');
// Bounded fetch: aborts after `ms` so a hung relay never leaves the UI in "settling…" forever.
// A timed-out fetch rejects with an AbortError (`e.name === 'AbortError'`); `isTimeout` lets the
// caller surface an honest "timed out" message instead of a generic error.
function fetchWithTimeout(url, opts, ms){
  const ctrl = new AbortController();
  const id = setTimeout(()=>ctrl.abort(), ms);
  return fetch(url, Object.assign({}, opts, {signal: ctrl.signal})).finally(()=>clearTimeout(id));
}
function isTimeout(e){ return e && e.name === 'AbortError'; }
const MERCHANT_HEX = '8139770ea87d175f56a35466c34c7ecccb8d8a91b4ee37a25df60f5b8fc9b394';
$('merchId').textContent = MERCHANT_HEX.slice(0,10) + '…';
let stream=null, scanning=false, lastCode=null, busy=false, currentNonce=null, pollTimer=null, settled=false;
const txns=[];

async function health(){
  try {
    const r=await fetchWithTimeout('/api/v1/health', {}, 5000);
    const j=await r.json(); const ok=r.ok&&j.status==='ok';
    $('dot').className='dot '+(ok?'ok':'down'); $('dotText').textContent=ok?'ledger online':'ledger down';
  } catch(e) {
    $('dot').className='dot down';
    $('dotText').textContent = isTimeout(e) ? 'relay unreachable (timed out)' : 'relay unreachable';
  }
}
setInterval(health,3000); health();

// --- request encoding (matches dpay_core::PaymentRequest: to|amount_le|nonce|expiry_le|currency_le) ---
function hexToBytes(hex,buf,off){ for(let i=0;i<hex.length/2;i++) buf[off+i]=parseInt(hex.substr(i*2,2),16); }
function bytesToHex(b){ return [...b].map(x=>x.toString(16).padStart(2,'0')).join(''); }
function writeU32LE(buf,off,n){ for(let i=0;i<4;i++){ buf[off+i]=n&0xff; n=Math.floor(n/256); } }
function writeU64LE(buf,off,n){ for(let i=0;i<8;i++){ buf[off+i]=n&0xff; n=Math.floor(n/256); } }
function b64url(bytes){ let s=''; for(const b of bytes) s+=String.fromCharCode(b); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64urlDecode(s){ s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4)s+='='; const bin=atob(s); const b=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i); return b; }
function randNonceHex(){ const a=new Uint8Array(16); crypto.getRandomValues(a); return bytesToHex(a); }
const DEMO_USD = 0;
function encodeRequest(toHex, cents, nonceHex, expiry, currency){
  const c = currency===undefined ? DEMO_USD : currency;
  const b=new Uint8Array(68);
  hexToBytes(toHex,b,0); writeU64LE(b,32,cents); hexToBytes(nonceHex,b,40); writeU64LE(b,56,expiry); writeU32LE(b,64,c);
  return b64url(b);
}
// The signed wire is from(32)|to(32)|amount(8)|nonce(16)@72|expiry(8)|currency_le(4)|from_name(32)|to_name(32)|memo(32)|sig(64)|from_pub(32) = 292 bytes (wire-format v2).
function nonceOfSigned(qr){ try { const w=b64urlDecode(qr.trim()); return w.length===292 ? bytesToHex(w.slice(72,88)) : null; } catch { return null; } }
function toCents(s){ const n=Math.round(parseFloat(s||'0')*100); return Number.isFinite(n)&&n>0?n:0; }

function createRequest(){
  const cents=toCents($('amt').value);
  if(!cents) return;
  currentNonce=randNonceHex();
  const expiry=Math.floor(Date.now()/1000)+600;
  const reqStr=encodeRequest(MERCHANT_HEX, cents, currentNonce, expiry);
  const qr=qrcode(0,'M'); qr.addData(reqStr); qr.make();
  $('reqQr').innerHTML=qr.createSvgTag({cellSize:6, margin:2});
  $('reqAmt').textContent=demoAmt(cents);
  $('reqPid').textContent='request '+currentNonce.slice(0,12)+'…';
  $('reqArea').style.display='block';
  $('collectCard').classList.remove('muted');
  $('result').innerHTML='<div class="sub">waiting for the payer…</div>';
  lastCode=null; settled=false;
  startScan().catch(()=>{});          // offline fallback: merchant scans the payer's QR
  startPoll();                        // online path: payer paid directly → detect it on-chain
}
function newCharge(){ stopScan(); clearInterval(pollTimer); currentNonce=null; settled=false; $('reqArea').style.display='none'; $('collectCard').classList.add('muted'); $('result').innerHTML=''; }

// Poll the ledger for this request's completion (the payer may have paid directly while online).
// A timed-out /receipt fetch is silently swallowed — the 1.2s poll retries next tick.
function startPoll(){
  clearInterval(pollTimer);
  pollTimer=setInterval(async ()=>{
    if(settled || !currentNonce) return;
    try {
      const r=await fetchWithTimeout('/api/v1/receipt/'+currentNonce, {}, 5000);
      if(r.ok){ const j=await r.json(); handleSettled(j); }
    } catch (e) { console.warn('receipt poll failed:', e); }
  }, 1200);
}
function handleSettled(j){
  const rc=j.receipt;
  if(settled) return; settled=true;
  stopScan(); clearInterval(pollTimer);
  const fromLabel=j.from_name || rc.from.slice(0,16)+'…';
  $('result').innerHTML=`<div class="paid">Paid ✓ ${demoAmt(rc.amount)}</div>`
    +`<div class="sub">payer balance now ${demoAmt(rc.new_from_balance)}</div>`
    +`<div class="mono">from ${fromLabel} · request ${rc.nonce.slice(0,12)}…</div>`;
  txns.push({amount:rc.amount, from:rc.from, name:j.from_name, time:new Date().toLocaleTimeString()});
  renderTxns();
}
$('createBtn').onclick=createRequest;
$('newBtn').onclick=newCharge;

function renderTxns(){
  const ul=$('txns');
  if(!txns.length){ ul.innerHTML='<li class="empty">No payments yet.</li>'; return; }
  ul.innerHTML=txns.slice().reverse().map(t=>{
    const fromLabel=t.name || t.from.slice(0,8)+'…';
    return `<li><span class="amt">${demoAmt(t.amount)}</span><span class="meta">${fromLabel} · ${t.time}</span></li>`;
  }).join('');
}

async function submit(qr){
  if(busy || !currentNonce) return;
  // Bind Collect to the CURRENT request: only accept the signed QR the payer produced for it.
  const n=nonceOfSigned(qr);
  if(n===null){ $('result').innerHTML='<div class="warnmsg">That’s not a payment QR.</div>'; return; }
  if(n!==currentNonce){
    $('result').innerHTML='<div class="warnmsg">That’s for a different request</div><div class="sub">Ask the payer to scan the current QR.</div>';
    return;
  }
  busy=true;
  const res=$('result'); res.innerHTML='<div class="sub">settling…</div>';
  try{
    const r=await fetchWithTimeout('/api/v1/pay',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({qr})}, 30000);
    const j=await r.json();
    if(r.ok){
      if(settled){ res.innerHTML=`<div class="warnmsg">↩ Already paid</div><div class="sub">${demoAmt(j.receipt.amount)} — not charged twice</div>`; }
      else handleSettled(j);
    }else{
      res.innerHTML=`<div class="refused">Refused</div><div class="sub">${j.error||'rejected'}</div>`;
    }
  }catch(e){
    if(isTimeout(e)){
      res.innerHTML=`<div class="refused">Settlement timed out</div><div class="sub">no response in 30s — check the relay.</div>`;
    }else{
      res.innerHTML=`<div class="refused">Error</div><div class="sub">${e}</div>`;
    }
  }
  finally{ busy=false; }
}

async function startScan(){
  if($('collectCard').classList.contains('muted')) return;
  try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}); }
  catch(e){ $('result').innerHTML=`<div class="sub">camera unavailable (${e.name}). Use the paste box.</div>`; return; }
  const v=$('video'); v.srcObject=stream; await v.play();
  $('startBtn').style.display='none'; $('stopBtn').style.display='inline-block';
  scanning=true; tick();
}
function stopScan(){ scanning=false; if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } $('startBtn').style.display='inline-block'; $('stopBtn').style.display='none'; }
function tick(){
  if(!scanning) return;
  const v=$('video'), c=$('canvas');
  if(v.readyState===v.HAVE_ENOUGH_DATA){
    c.width=v.videoWidth; c.height=v.videoHeight;
    const ctx=c.getContext('2d'); ctx.drawImage(v,0,0,c.width,c.height);
    const img=ctx.getImageData(0,0,c.width,c.height);
    const code=jsQR(img.data,img.width,img.height,{inversionAttempts:'dontInvert'});
    if(code&&code.data&&code.data!==lastCode){ lastCode=code.data; submit(code.data); }
  }
  requestAnimationFrame(tick);
}
$('startBtn').onclick=startScan;
$('stopBtn').onclick=stopScan;
$('pasteBtn').onclick=()=>{ const v=$('pasteBox').value.trim(); if(v) submit(v); };
</script>
</body>
</html>
