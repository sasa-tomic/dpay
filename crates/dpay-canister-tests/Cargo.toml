[package]
name = "dpay-canister-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PocketIC integration tests for the dpay canister (offline, deterministic, seconds)."

[lib]
path = "src/lib.rs"

[dependencies]
dpay-core = { path = "../dpay-core", features = ["rng"] }
ed25519-dalek = { workspace = true }
pocket-ic = { workspace = true }
candid = { workspace = true }
serde = { version = "1", features = ["derive"] }
