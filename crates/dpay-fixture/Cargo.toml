[package]
name = "dpay-fixture"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Emits deterministic dfx candid argument files (ledger init + one offline-signed payment) so the real dfx-deploy smoke test submits the exact wire the phone signs."

[[bin]]
name = "dpay-fixture"
path = "src/main.rs"

[dependencies]
# The SAME core the canister/relay/app/sim link — the fixture packages its output, never reimplements it.
dpay-core = { path = "../dpay-core" }
ed25519-dalek = { workspace = true }
# serde for the `wire-layout` JSON emitter (the JS signing shim reads its output).
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
# Test-only hex decoder for the wire-layout round-trip test.
hex = "0.4.3"
