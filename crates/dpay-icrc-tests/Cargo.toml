[package]
name = "dpay-icrc-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PocketIC proof: offline-sign -> dpay-canister-icrc -> ICRC ledger settlement (offline, deterministic, seconds)."

[lib]
path = "src/lib.rs"

[dependencies]
dpay-core = { path = "../dpay-core", features = ["rng"] }
ed25519-dalek = { workspace = true }
pocket-ic = { workspace = true }
candid = { workspace = true }
serde = { version = "1", features = ["derive"] }
icrc-ledger-types = { workspace = true }
num-traits = "0.2"
