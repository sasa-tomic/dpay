[package]
name = "dpay-sim"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Narrated end-to-end demo: offline sign -> canister settlement -> Paid. Self-checking."

[[bin]]
name = "dpay-sim"
path = "src/main.rs"

[dependencies]
dpay-core = { path = "../dpay-core", features = ["rng"] }
ed25519-dalek = { workspace = true }
pocket-ic = { workspace = true }
candid = { workspace = true }
serde = { version = "1", features = ["derive"] }
icrc-ledger-types = { workspace = true }
num-traits = "0.2"
