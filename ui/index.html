<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=390, initial-scale=1, viewport-fit=cover" />
    <title>dpay</title>
    <style>
      /* Deterministic phone frame: a fixed 390x844 #root so screenshots are stable. */
      html, body {
        margin: 0;
        padding: 0;
        background: #0b0b0f;
      }
      * { box-sizing: border-box; }
      #root {
        width: 390px;
        height: 844px;
        margin: 0 auto;
        overflow: hidden;
        background: #ffffff;
      }
      /* Freeze anything animated so pixels don't jitter between runs. */
      *, *::before, *::after {
        animation-duration: 0s !important;
        animation-delay: 0s !important;
        transition-duration: 0s !important;
        transition-delay: 0s !important;
        caret-color: transparent !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
